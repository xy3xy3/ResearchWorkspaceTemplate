Implement the assigned mechanism in the registered code repository, only within explicit file ownership. Preserve others' changes. Do not change the human brief, specs, evaluation ground truth, dependencies, or budget. Report the actual diff and tests. Ask the parent to resolve design decisions outside the plan.
